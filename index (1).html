<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pacto Sombrio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: a phone-sized stage (full screen on phones, framed on desktop) holding six stacked screens; blood drips fixed behind, final screen scrolls with photos that shrink and fade away from the centre. */
:root{
  --ink:#040203;
  --bone:#e2e2e8;
  --steel:#9c9ca6;
  --iron:#3a3a42;
  --blood:#d0161f;
  --blood-deep:#5e050b;
  --ember:#ff4a4a;
  --caps:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:6px}

.stage{
  position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 100%,#2a0306 0%,#0a0203 45%,#030203 100%);
  container-type:inline-size;
}
@media (min-width:600px){
  .stage{height:min(100%,900px);border-radius:38px;border:2px solid var(--iron);
    box-shadow:0 0 0 6px #0b0b0d,0 0 0 7px #2b2b31,0 30px 80px rgba(120,0,10,.35)}
}
.bg{position:absolute;inset:0;pointer-events:none;z-index:0}
.bg svg{position:absolute;left:0;top:0;width:100%;height:110px;opacity:.95}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* screens */
.screen{position:absolute;inset:0;z-index:1;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.screen::-webkit-scrollbar{display:none}
.screen:not([hidden]){animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.content{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4.5cqw,30px);
  padding-block:clamp(56px,11cqw,84px) clamp(28px,7cqw,48px);
  padding-left:max(22px,env(safe-area-inset-left,0px));
  padding-right:max(22px,env(safe-area-inset-right,0px));
  text-align:center;
}

/* metallic and blood lettering */
.metal,.blood{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.metal{background-image:linear-gradient(180deg,#f4f4f7 0%,#b6b6bf 36%,#6a6a73 55%,#d2d2d9 78%,#8c8c95 100%);
  filter:drop-shadow(0 2px 1px #000) drop-shadow(0 0 10px rgba(220,220,240,.14))}
.blood{background-image:linear-gradient(180deg,#ff7a7a 0%,#d9202a 42%,#7a070d 100%);
  filter:drop-shadow(0 2px 1px #000) drop-shadow(0 0 14px rgba(208,22,31,.65))}

.hero{position:relative;width:100%;display:grid;justify-items:center;align-items:center}
.hero>*{grid-area:1/1}
.hero.stack{row-gap:0}
.hero.stack>.title{margin-top:-3cqw}
.hero.stack>.bat{grid-area:auto}
.hero.stack{display:flex;flex-direction:column;align-items:center}
.bat{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 12px #000)}
.hero:not(.stack)>.bat{filter:brightness(.4) drop-shadow(0 8px 12px #000)}
.hero:not(.stack)>.bat.red{filter:brightness(.42) drop-shadow(0 0 14px rgba(208,22,31,.8)) drop-shadow(0 8px 12px #000)}
.bat.red{filter:drop-shadow(0 0 14px rgba(208,22,31,.7)) drop-shadow(0 8px 12px #000)}
.title{margin:0;font-family:var(--caps);font-weight:700;line-height:1.04;letter-spacing:.02em;text-align:center;
  font-size:2.2rem;font-size:clamp(2rem,12.4cqw,3.5rem)}
.title.mid{font-size:1.7rem;font-size:clamp(1.55rem,8.2cqw,2.3rem);line-height:1.12}
.title.word{font-size:2.8rem;font-size:clamp(2.6rem,15cqw,4.2rem);margin-top:.1em}
.title small{display:block;font-weight:600;font-size:.56em;letter-spacing:.05em;margin-top:.15em}

/* bat buttons */
.batbtn{position:relative;display:block;width:min(80%,290px);aspect-ratio:5/2;transition:transform .2s,filter .2s}
.batbtn:hover{transform:scale(1.04);filter:brightness(1.15)}
.batbtn:active{transform:scale(.97)}
.batbtn.small{width:min(62%,220px)}
.batbtn svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 8px #000)}
.plate{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);min-width:42%;padding:.3em .9em;
  border:1.5px solid rgba(208,208,218,.7);border-radius:12px;background:linear-gradient(#17171b,#050506);
  box-shadow:inset 0 0 0 3px #000,0 0 0 1px #000;
  font-family:var(--caps);font-weight:700;letter-spacing:.07em;font-size:1.3rem;font-size:clamp(1.05rem,6.2cqw,1.65rem);line-height:1.15}
.batbtn.red .plate{border-color:#ff5a5a;background:linear-gradient(#2a0509,#080102);box-shadow:inset 0 0 0 3px #000,0 0 16px rgba(208,22,31,.55)}
.batbtn.red{filter:drop-shadow(0 0 10px rgba(208,22,31,.45))}

/* ornate message frame */
.frame{position:relative;width:100%;padding:1.3em 1.2em;border:1px solid rgba(190,190,202,.55);
  background:linear-gradient(#0c0c0f,#040405);box-shadow:inset 0 0 0 4px #000,inset 0 0 0 5px rgba(150,150,162,.35),0 0 24px rgba(0,0,0,.8);
  font-size:1.35rem;font-size:clamp(1.25rem,6.6cqw,1.7rem);line-height:1.35;font-weight:500;color:#d4d4db}
.frame::before,.frame::after{content:"";position:absolute;left:50%;width:11px;height:11px;background:#050506;
  border:1px solid rgba(200,200,212,.75);transform:translate(-50%,-50%) rotate(45deg)}
.frame::before{top:0}.frame::after{top:100%}
.frame.red{border-color:#ff4a4a;color:#ff6b6b;box-shadow:inset 0 0 0 3px #000,0 0 18px rgba(208,22,31,.5);background:linear-gradient(#1c0306,#070102)}
.frame.red::before,.frame.red::after{display:none}
a.frame,button.frame{display:block;text-align:center}
.pill{display:inline-block;margin-top:.2em;padding:.55em 1.3em;border:1.5px solid var(--ember);color:#ff5a5a;background:#12030477;
  font-family:var(--body);font-weight:600;font-size:1.15rem;letter-spacing:.02em;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
  box-shadow:0 0 14px rgba(208,22,31,.5)}
.pill:hover{background:#2a0509}

/* chevrons */
.chev{width:34px;height:34px;display:grid;place-items:center;opacity:.85;animation:bob 1.8s ease-in-out infinite}
.chev svg{width:100%;height:100%;fill:none;stroke:#b8b8c2;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chev.up svg{transform:rotate(180deg)}
.chev.red svg{stroke:#c4121c}
@keyframes bob{50%{transform:translateY(6px)}}
.chev.up{animation-name:bobup}
@keyframes bobup{50%{transform:translateY(-6px)}}

/* password */
.field{position:relative;width:100%}
.field input{width:100%;height:3.2rem;padding:0 3.4rem 0 1rem;background:#050506;color:var(--bone);
  border:1px solid rgba(190,190,202,.6);box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px rgba(150,150,162,.3);
  border-radius:4px;font:600 1.3rem var(--caps);letter-spacing:.08em;text-align:center;outline:none}
.field input:focus{border-color:#fff;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 4px rgba(150,150,162,.3),0 0 18px rgba(230,230,255,.25)}
.field .go{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:4px}
.field .go svg{width:22px;height:22px;fill:none;stroke:#d0d0d8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.field.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* wrong screen */
.demon{position:relative;width:78%}
.demon::before{content:"";position:absolute;inset:-30% -10%;background:radial-gradient(closest-side,rgba(208,22,31,.45),transparent 70%)}
.demon svg{position:relative;width:100%;height:auto;filter:drop-shadow(0 0 16px rgba(255,40,40,.7)) drop-shadow(0 8px 12px #000)}

/* home pool of blood (scroll) */
.pool{position:relative;height:100%;min-height:420px;background:linear-gradient(#000 0%,#22030500 0%,#3a0509 70%,#16010300 100%);
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,#240407 55%,#4a060b 100%)}
.pool svg{position:absolute;left:0;top:0;width:100%;height:70%}
.pool .chev{position:absolute;left:50%;bottom:36px;margin-left:-17px}

/* final */
.final{overflow:hidden}
.scroller{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 5%,#000 80%,transparent 96%);
  mask-image:linear-gradient(180deg,transparent 0,#000 5%,#000 80%,transparent 96%)}
.scroller::-webkit-scrollbar{display:none}
.reel{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,3cqw,18px);text-align:center;
  padding-top:clamp(40px,9cqw,70px);padding-bottom:150px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.photo{position:relative;width:min(90%,390px);aspect-ratio:400/340;flex:none;transform-origin:50% 50%;will-change:transform,opacity;margin:0}
.photo .wings{position:absolute;left:0;top:0;width:100%;height:auto;filter:drop-shadow(0 6px 10px #000)}
.photo .rim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 6px rgba(0,0,0,.9))}
.heart{position:absolute;left:22.5%;top:20.6%;width:55%;height:58.8%;clip-path:url(#heartClip);background:#0b0b0e;cursor:pointer;display:grid;place-items:center;overflow:hidden}
.heart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.heart.has img{display:block}
.heart.has{cursor:default}
.heart .ph{display:grid;justify-items:center;gap:4px;padding:0 20%;margin-top:-10%;color:#8b8b95;font-size:.85rem;line-height:1.15}
.heart .ph svg{width:44px;height:auto;opacity:.8}
.heart.has .ph{display:none}
.hintline{display:grid;justify-items:center;gap:2px;color:#b8b8c2;font-size:1.05rem;padding:6px 0}
.hintline span{display:flex;align-items:center;gap:10px}
.hintline span::before,.hintline span::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,#8b8b95)}
.hintline span::after{transform:scaleX(-1)}
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:44px 0 clamp(14px,4cqw,26px);
  background:linear-gradient(180deg,transparent,#000 62%);pointer-events:none}
.dock .batbtn{pointer-events:auto}

@media (prefers-reduced-motion:reduce){
  .screen:not([hidden]){animation:none}.chev{animation:none}.field.shake{animation:none}
}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gMetal" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
      <stop offset="0" stop-color="#e4e4ea"/><stop offset=".32" stop-color="#8a8a93"/>
      <stop offset=".62" stop-color="#26262b"/><stop offset="1" stop-color="#5a5a63"/>
    </linearGradient>
    <linearGradient id="gBlood" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="160">
      <stop offset="0" stop-color="#ff5a5a"/><stop offset=".4" stop-color="#b3101a"/>
      <stop offset=".75" stop-color="#4a050a"/><stop offset="1" stop-color="#7a0a12"/>
    </linearGradient>
    <linearGradient id="gDrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e0c14"/><stop offset="1" stop-color="#2a0306"/>
    </linearGradient>
    <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
      <path d="M0.5,1 C0.12,0.7 0,0.5 0,0.3 C0,0.12 0.13,0 0.27,0 C0.38,0 0.46,0.07 0.5,0.16 C0.54,0.07 0.62,0 0.73,0 C0.87,0 1,0.12 1,0.3 C1,0.5 0.88,0.7 0.5,1 Z"/>
    </clipPath>
    <g id="batShape">
      <path d="M196,70 C182,44 150,26 104,28 C66,30 30,40 4,22 C14,48 18,68 28,90 C40,74 54,70 66,74 C72,94 80,106 92,118 C102,98 116,90 132,92 C140,106 152,118 164,126 C172,108 184,98 198,98 Z"/>
      <path transform="translate(400 0) scale(-1 1)" d="M196,70 C182,44 150,26 104,28 C66,30 30,40 4,22 C14,48 18,68 28,90 C40,74 54,70 66,74 C72,94 80,106 92,118 C102,98 116,90 132,92 C140,106 152,118 164,126 C172,108 184,98 198,98 Z"/>
      <path d="M186,62 L188,34 L196,48 L204,48 L212,34 L214,62 C214,78 208,92 200,100 C192,92 186,78 186,62 Z"/>
      <g fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round">
        <path d="M178,62 L4,22 M178,62 L28,90 M178,62 L92,118 M178,62 L164,126"/>
        <path d="M222,62 L396,22 M222,62 L372,90 M222,62 L308,118 M222,62 L236,126"/>
      </g>
    </g>
  </defs>
</svg>

<main class="stage" id="stage">
  <div class="bg" aria-hidden="true"><svg id="dripsTop" viewBox="0 0 400 110" preserveAspectRatio="none"></svg></div>

  <!-- 1. Tela inicial -->
  <section class="screen" id="s-home" data-screen="home" aria-label="Pedido">
    <div class="content">
      <div class="hero stack">
        <svg class="bat" viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <h1 class="title metal">QUER<br>NAMORAR<br>COMIGO?</h1>
      </div>
      <button class="batbtn" data-go="pass" aria-label="Sim">
        <svg viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <span class="plate"><span class="metal">SIM</span></span>
      </button>
      <button class="batbtn red" data-go="no" aria-label="Não">
        <svg viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gBlood)" stroke="#ff6a6a" stroke-width="1.3"/></svg>
        <span class="plate"><span class="blood">NÃO</span></span>
      </button>
      <button class="chev red" data-scroll="#pool" aria-label="Rolar para baixo">
        <svg viewBox="0 0 24 24"><path d="M5 6l7 7 7-7M5 12l7 7 7-7"/></svg>
      </button>
    </div>
    <div class="pool" id="pool" aria-hidden="true">
      <svg id="dripsPool" viewBox="0 0 400 300" preserveAspectRatio="none"></svg>
      <button class="chev up red" data-scrolltop aria-label="Voltar ao topo"><svg viewBox="0 0 24 24"><path d="M5 6l7 7 7-7M5 12l7 7 7-7"/></svg></button>
    </div>
  </section>

  <!-- 2. Tela do NÃO -->
  <section class="screen" id="s-no" data-screen="no" hidden aria-label="Opção indisponível">
    <div class="content">
      <div class="hero">
        <svg class="bat red" viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gBlood)" stroke="#ff6a6a" stroke-width="1.3"/></svg>
        <h2 class="title word blood">NÃO</h2>
      </div>
      <button class="frame" data-go="home">Essa opção não está disponível, tente novamente.</button>
      <button class="pill" data-go="home">Clique aqui para voltar</button>
    </div>
  </section>

  <!-- 3. Tela da senha -->
  <section class="screen" id="s-pass" data-screen="pass" hidden aria-label="Senha">
    <div class="content">
      <div class="hero stack">
        <svg class="bat" viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <h2 class="title mid metal">DIGITE A SENHA<br>PRA CONFIRMAR<br>A RELAÇÃO</h2>
      </div>
      <form class="field" id="passForm" autocomplete="off" novalidate>
        <label class="sr" for="pw">Senha</label>
        <input id="pw" name="pw" type="text" inputmode="text" enterkeyhint="go" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="40">
        <button class="go" type="submit" aria-label="Confirmar senha"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <button class="batbtn small" data-go="hint" aria-label="Dicas">
        <svg viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <span class="plate"><span class="metal">DICAS</span></span>
      </button>
      <button class="batbtn small" data-go="home" aria-label="Voltar">
        <svg viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <span class="plate"><span class="metal">VOLTAR</span></span>
      </button>
    </div>
  </section>

  <!-- 4. Tela da dica -->
  <section class="screen" id="s-hint" data-screen="hint" hidden aria-label="Dicas">
    <div class="content">
      <div class="hero">
        <svg class="bat" viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <h2 class="title word metal">DICAS</h2>
      </div>
      <div class="frame" style="padding-block:2.2em">Você é…<br>mas nunca foi diagnosticada.</div>
      <button class="batbtn small" data-go="pass" aria-label="Voltar">
        <svg viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <span class="plate"><span class="metal">VOLTAR</span></span>
      </button>
    </div>
  </section>

  <!-- 5. Senha errada -->
  <section class="screen" id="s-wrong" data-screen="wrong" hidden aria-label="Senha errada">
    <div class="content">
      <div class="hero">
        <svg class="bat red" viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gBlood)" stroke="#ff6a6a" stroke-width="1.3"/></svg>
        <h2 class="title mid blood" style="font-size:clamp(1.9rem,11cqw,3.1rem)">ESTÁ ERRADA.</h2>
      </div>
      <div class="demon" aria-hidden="true">
        <svg viewBox="0 0 400 160"><use href="#batShape" fill="url(#gBlood)" stroke="#ff6a6a" stroke-width="1.3"/>
          <ellipse cx="193" cy="62" rx="4.2" ry="2.6" fill="#ff2a2a" transform="rotate(14 193 62)"/>
          <ellipse cx="207" cy="62" rx="4.2" ry="2.6" fill="#ff2a2a" transform="rotate(-14 207 62)"/>
        </svg>
      </div>
      <div class="frame red">está errada,<br>tente novamente.</div>
      <button class="batbtn small" data-go="pass" aria-label="Voltar">
        <svg viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <span class="plate"><span class="metal">VOLTAR</span></span>
      </button>
    </div>
  </section>

  <!-- 6. Tela final -->
  <section class="screen final" id="s-final" data-screen="final" hidden aria-label="Parabéns">
    <div class="scroller" id="scroller">
      <div class="reel" id="reel">
        <div class="hero" style="width:92%">
          <svg class="bat" viewBox="0 0 400 160" aria-hidden="true" style="opacity:.9"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
          <h2 class="title mid metal" style="align-self:center;font-size:clamp(1.9rem,11cqw,3rem)">PARABÉNS!<small>ESTAMOS CASADOS</small></h2>
        </div>
        <!-- fotos entram aqui via script -->
      </div>
    </div>
    <div class="dock">
      <button class="batbtn small" data-go="home" aria-label="Voltar">
        <svg viewBox="0 0 400 160" aria-hidden="true"><use href="#batShape" fill="url(#gMetal)" stroke="#e4e4ea" stroke-width="1.3"/></svg>
        <span class="plate"><span class="metal">VOLTAR</span></span>
      </button>
    </div>
  </section>
  <input type="file" id="filePick" accept="image/*" hidden>
</main>

<script>
(function(){
  'use strict';
  var PASSWORD = 'lindona';
  var HEART = 'M0.5,1 C0.12,0.7 0,0.5 0,0.3 C0,0.12 0.13,0 0.27,0 C0.38,0 0.46,0.07 0.5,0.16 C0.54,0.07 0.62,0 0.73,0 C0.87,0 1,0.12 1,0.3 C1,0.5 0.88,0.7 0.5,1 Z';
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function(s, r){ return (r || document).querySelector(s); };
  var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ---------- sangue escorrendo ---------- */
  function drips(svg, w, h, n, seed, minL, maxL){
    var s = seed;
    function rnd(){ s = (s * 16807) % 2147483647; return s / 2147483647; }
    var out = '<rect x="0" y="0" width="' + w + '" height="' + (h * 0.1) + '" fill="url(#gDrip)"/>';
    for (var i = 0; i < n; i++){

  var screens = {};

  var pw = $('#pw');

  function go(name){
    var target = screens[name];
    if (!target) return;
    Object.keys(screens).forEach(function(k){ screens[k].hidden = (k !== name); });
    target.scrollTop = 0;
    if (name === 'final'){ $('#scroller').scrollTop = 0; fx(); }
    if (name === 'pass'){ pw.value = ''; }
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-go]');

      var dest = t.getAttribute('data-go');
      go(dest);
      if (dest === 'pass' && (t.closest('#s-hint') || t.closest('#s-wrong'))){
        try { pw.focus({preventScroll:true}); } catch(_){}
      }
      return;
    }
    var sc = e.target.closest('[data-scroll]');
    if (sc){
      var el = $(sc.getAttribute('data-scroll'));
      if (el) el.scrollIntoView({behavior:'smooth', block:'end'});
      return;
    }
    if (e.target.closest('[data-scrolltop]')) screens.home.scrollTo({top:0, behavior:'smooth'});
  });

    if (i === 1) fig.id = 'photo2';
  }
  var endUp = document.createElement('button');
  endUp.type = 'button'; endUp.className = 'chev up'; endUp.setAttribute('aria-label', 'Voltar ao topo');
  endUp.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 6l7 7 7-7M5 12l7 7 7-7"/></svg>';
  endUp.addEventListener('click', function(){ $('#scroller').scrollTo({top:0, behavior:'smooth'}); });
  reel.appendChild(endUp);

  function setPhoto(i, src){
    var heart = $('.heart', photos[i]), img = $('img', heart);
    if (src){ img.src = src; heart.classList.add('has'); } else { img.removeAttribute('src'); heart.classList.remove('has'); }
  }
  var picker = $('#filePick');
  reel.addEventListener('click', function(e){
    var h = e.target.closest('.heart');
    if (!h || h.classList.contains('has')) return;
    pickIndex = +h.getAttribute('data-i'); picker.value = ''; picker.click();
  });
  reel.addEventListener('keydown', function(e){
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('heart')){ e.preventDefault(); e.target.click(); }
  });
  picker.addEventListener('change', function(){
    var f = picker.files && picker.files[0]; if (!f || pickIndex < 0) return;
    var idx = pickIndex, fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var k = Math.min(1, 900 / Math.max(im.width, im.height));
        var c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        var data = c.toDataURL('image/jpeg', 0.85);
        saved[idx] = data; setPhoto(idx, data); persist();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });

  /* fotos diminuem e esmaecem conforme se afastam do centro da tela */
  var scroller = $('#scroller'), raf = 0;
  function fx(){
    raf = 0;
    var r = scroller.getBoundingClientRect();
    if (!r.height) return;
    var cy = r.top + r.height * 0.45;
    photos.forEach(function(p){
      var b = p.getBoundingClientRect();
      var d = Math.abs(b.top + b.height / 2 - cy) / r.height;
      var t = Math.min(1, Math.max(0, (d - 0.12) / 0.7));
      p.style.transform = 'scale(' + (1 - 0.5 * t).toFixed(3) + ')';
      p.style.opacity = (1 - 0.93 * t).toFixed(3);
    });
  }
  scroller.addEventListener('scroll', function(){ if (!raf) raf = requestAnimationFrame(fx); }, {passive:true});
  window.addEventListener('resize', fx);
})();
</script>

</body>
</html>
